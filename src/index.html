<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MuseDesk</title>
  <link rel="stylesheet" href="styles.css?v=fluent2" />
</head>
<body>
  <header class="topbar">
    <span class="brand">
      <svg class="mark" viewBox="0 0 36 24" aria-hidden="true">
        <path d="M18 12 C18 7 14.5 4 10.5 4 C6 4 3 7.6 3 12 C3 16.4 6 20 10.5 20 C14.5 20 18 17 18 12 C18 7 21.5 4 25.5 4 C30 4 33 7.6 33 12 C33 16.4 30 20 25.5 20 C21.5 20 18 17 18 12 Z"
          fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" />
      </svg>
      MuseDesk
    </span>
    <button id="newchat" type="button">New chat</button>
  </header>

  <main id="messages"></main>

  <section id="welcome">
    <svg class="mark hero" viewBox="0 0 36 24" aria-hidden="true">
      <path d="M18 12 C18 7 14.5 4 10.5 4 C6 4 3 7.6 3 12 C3 16.4 6 20 10.5 20 C14.5 20 18 17 18 12 C18 7 21.5 4 25.5 4 C30 4 33 7.6 33 12 C33 16.4 30 20 25.5 20 C21.5 20 18 17 18 12 Z"
        fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
    </svg>
    <h2>Good to see you, Amit.</h2>
    <p class="caption">Powered by Meta Model API</p>
  </section>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask anything… (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send" aria-label="Send" title="Send">&#8593;</button>
    </div>
    <div class="sugg" id="sugg">
      <button type="button" data-prompt="list the files in C:\Users\Amit Brahmbhatt\muse-desk\muse-desk">List my project files</button>
      <button type="button" data-prompt="run whoami in wsl">Run whoami in WSL</button>
      <button type="button" data-prompt="create a file called musedesk-hello.txt in C:\Users\Amit Brahmbhatt\muse-desk\muse-desk with the text &quot;hello from musedesk&quot;">Create a test file</button>
    </div>
  </footer>

  <script src="main.js?v=1"></script>
</body>
</html>
